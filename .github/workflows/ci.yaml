name: CI

on:
  push:
    branches: ['develop/**', 'release/**']
  pull_request:
    branches: ['develop/**', 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile + Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
    - name: Cache Ivy packages
      uses: actions/cache@v4
      with:
        path: ~/.ivy2/cache/
        key: ${{ runner.os }}-ivy-${{ hashFiles('**/ivy-versions.properties') }}
        restore-keys: |
          ${{ runner.os }}-ivy-
    - name: Ivy bootstrap
      run: ant ivy-bootstrap
    - name: Validate
      run: ant validate

  lucene-tests:
    name: Lucene Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: compile
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
    - name: Cache Ivy packages
      uses: actions/cache@v4
      with:
        path: ~/.ivy2/cache/
        key: ${{ runner.os }}-ivy-${{ hashFiles('**/ivy-versions.properties') }}
        restore-keys: |
          ${{ runner.os }}-ivy-
    - name: Ivy bootstrap
      run: ant ivy-bootstrap
    - name: Run Lucene tests
      run: ant -f lucene/build.xml test
    - name: Upload test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: lucene-test-reports
        path: lucene/**/build/**/test/TEST-*.xml
        if-no-files-found: ignore

  solr-tests:
    name: Solr Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: compile
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: temurin
    - name: Cache Ivy packages
      uses: actions/cache@v4
      with:
        path: ~/.ivy2/cache/
        key: ${{ runner.os }}-ivy-${{ hashFiles('**/ivy-versions.properties') }}
        restore-keys: |
          ${{ runner.os }}-ivy-
    - name: Ivy bootstrap
      run: ant ivy-bootstrap
    - name: Run Solr tests
      run: ant -f solr/build.xml test
    - name: Upload test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: solr-test-reports
        path: solr/**/build/**/test/TEST-*.xml
        if-no-files-found: ignore
